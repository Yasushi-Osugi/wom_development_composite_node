      id:"bugs", title:"既知バグ修正履歴", color:"pink",
      desc:"新しいClaude君（AI）へ引き継ぐバグ修正の記録。再発防止のための設計注意事項。",
      nodes:[
        {id:"bug1", label:"HolidayCalendarPlugin MemoryError", sub:"修正済み",
         detail:"on_post_backwardでcap_hard(w)==0.0で閉鎖週判定していたが、plan_node.pyがデフォルト全週cap_hard=0.0に初期化するため全週閉鎖扱いになりdisplaced lotsが指数的増加してMemoryError。修正: explicit_closures dictを構築しCSVに明示定義した週のみ閉鎖週とする。",
         tags:["HolidayCalendar","MemoryError","cap_hard","explicit_closures","修正済"]},
        {id:"bug2", label:"_build_lot_leaf_index 未実装", sub:"修正済み（Smartphone AttributeError）",
         detail:"backward_planner.pyの多MOMパスで_build_lot_leaf_indexを呼び出していたが未実装だった（SmartphoneモデルでAttributeError）。修正: OTツリーのleaf_outノードを走査してlot_id→PlanNodeインデックスを構築。leaf.regionはlot_id.split(':')[1]で抽出。",
         tags:["BackwardPlanner","MultiMOM","AttributeError","lot_id","修正済","Smartphone"]},
        {id:"bug3", label:"holiday_calendar.csvノード名誤り", sub:"修正済み",
         detail:"demand_multiplier行のノード名がSales_US_Phone16/Sales_EU_Phone16（存在しない）。正しくはRetail_AMER/Retail_EMEA（sc_tree_master.csvのleaf_out node_name）。",
         tags:["holiday_calendar","ノード名","Retail_AMER","Retail_EMEA","修正済"]},
        {id:"bug4", label:"ファイルnullバイト汚染", sub:"修正済み（Windowsコピー起因）",
         detail:"v1r0m1のbackward_planner.pyとholiday_calendar.csvにnullバイト混入（Windowsでのコピー操作が原因の可能性）。Linux bashのcpで上書きして修復。app.pyはLinux bashで約172KB切り捨て→Windowsで構文チェック: python -c \"import ast; ast.parse(open('wom/gui/app.py').read())\"",
         tags:["nullバイト","Windows","bash","app.py","172KB","構文チェック","修正済"]}
      ],
      edges:[
        {from:"bug1", to:"bug2", label:"同一プラグイン系"},
        {from:"bug3", to:"bug1", label:"ノード名不一致が原因"}
      ]
    }
  ]
};

const COLORS={purple:'#7F77DD',teal:'#1D9E75',coral:'#D85A30',blue:'#378ADD',amber:'#BA7517',green:'#639922',gray:'#888780',pink:'#D4537E'};
const FILLS={purple:'#EEEDFE',teal:'#E1F5EE',coral:'#FAECE7',blue:'#E6F1FB',amber:'#FAEEDA',green:'#EAF3DE',gray:'#F1EFE8',pink:'#FBEAF0'};
const TEXTS={purple:'#3C3489',teal:'#085041',coral:'#712B13',blue:'#0C447C',amber:'#633806',green:'#27500A',gray:'#444441',pink:'#72243E'};

let currentAsk='WOMのアーキテクチャについて説明してください';

function init(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML=`<div class="sb-head">${DATA.project}</div>`;
  DATA.sections.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='nav-item'+(i===0?' active':'');
    el.id='nav-'+s.id;
    el.innerHTML=`<span class="dot" style="background:${COLORS[s.color]||COLORS.gray}"></span>${s.title}`;
    el.onclick=()=>showSection(s.id);
    sb.appendChild(el);
  });
  showSection(DATA.sections[0].id);
}

function showSection(id){
  const s=DATA.sections.find(x=>x.id===id);
  if(!s)return;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const nav=document.getElementById('nav-'+id);
  if(nav)nav.classList.add('active');
  document.getElementById('vtitle').textContent=s.title;
  document.getElementById('vdesc').textContent=s.desc;
  currentAsk=`WOMの「${s.title}」について詳しく説明してください`;
  clearDet();
  renderDiagram(s);
}

function renderDiagram(s){
  const nodes=s.nodes||[],edges=s.edges||[];
  const col=s.color||'gray';
  const fill=FILLS[col],stroke=COLORS[col],txt=TEXTS[col];
  const W=430,NW=126,NH=60,GAP=16,PAD=26;
  const cols=Math.min(3,nodes.length);
  const rows=Math.ceil(nodes.length/cols);
  const totalW=cols*NW+(cols-1)*GAP;
  const startX=(W-totalW)/2;
  const pos={};
  nodes.forEach((n,i)=>{
    const c=i%cols,r=Math.floor(i/cols);
    pos[n.id]={x:startX+c*(NW+GAP),y:PAD+r*(NH+50)};
  });
  const H=PAD+rows*(NH+50)+20;
  let lines='',nsvg='';
  edges.forEach(e=>{
    const a=pos[e.from],b=pos[e.to];
    if(!a||!b)return;
    const x1=a.x+NW/2,y1=a.y+NH,x2=b.x+NW/2,y2=b.y,my=(y1+y2)/2;
    lines+=`<path d="M${x1} ${y1} C${x1} ${my+8} ${x2} ${my-8} ${x2} ${y2}" fill="none" stroke="${stroke}" stroke-width="0.8" opacity="0.5" marker-end="url(#ar)"/>`;
    if(e.label)lines+=`<text x="${(x1+x2)/2+6}" y="${my}" font-size="9" fill="${txt}" font-family="sans-serif" opacity="0.8">${e.label}</text>`;
  });
  nodes.forEach(n=>{
    const p=pos[n.id];
    if(!p)return;
    const cx=p.x+NW/2;
    const esc=s=>s.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    nsvg+=`<g style="cursor:pointer" onclick="selNode('${esc(n.label)}','${esc(n.detail||'')}','${esc((n.tags||[]).join(','))}')">
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="0.5"/>
      <text x="${cx}" y="${p.y+22}" text-anchor="middle" font-size="12" font-weight="600" fill="${txt}" font-family="sans-serif">${n.label}</text>
      <text x="${cx}" y="${p.y+41}" text-anchor="middle" font-size="9.5" fill="${txt}" font-family="sans-serif" opacity="0.8">${n.sub||''}</text>
    </g>`;
  });
  document.getElementById('diagram').innerHTML=`<svg width="100%" viewBox="0 0 ${W} ${H}" role="img"><title>${s.title}</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>${lines}${nsvg}</svg>`;
}

function selNode(label,detail,tags){
  document.getElementById('dt').textContent=label;
  document.getElementById('db').textContent=detail||'詳細なし';
  const tArr=tags?tags.split(',').filter(Boolean):[];
  document.getElementById('dtags').innerHTML=tArr.map(t=>`<span class="tag">${t}</span>`).join('');
  currentAsk=`WOMの「${label}」について詳しく説明してください`;
}

function clearDet(){
  document.getElementById('dt').textContent='ノードをクリック';
  document.getElementById('db').textContent='ダイアグラム上の要素をクリックすると詳細が表示されます。';
  document.getElementById('dtags').innerHTML='';
}

function copyAsk(){
  navigator.clipboard.writeText(currentAsk).then(()=>{
    const btn=document.getElementById('askbtn');
    btn.textContent='✓ コピーしました';
    setTimeout(()=>{btn.textContent='📋 質問をコピー';},1800);
  }).catch(()=>alert(currentAsk));
}

init();
</script>
