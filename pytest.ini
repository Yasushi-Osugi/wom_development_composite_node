[pytest]
# Test tiers (RequestLetter_QuickCheckTests). Markers are added in tests/conftest.py
# from one table (file -> area); see tests/README.md and tools/quick_check.py.
addopts = --strict-markers
markers =
    core: Planning Engine and the Unit/Integration layers of the 3-layer tests
    capacity: the upper (capacity) layer
    rice: Rice seasonal model and layer
    plugins: plugins and plugin selection
    ppc: PPC, Value Chain, money
    allocation: Management-layer allocation analysis
    lovem: LOVEM observation and viewer
    gui: opens tkinter windows (or GUI view models)
    worldmap: World Map
    golden: E2E golden regression (tests/golden)
    public: public-readiness checks (names, plugin sets, evidence, the tiers themselves)
    smoke: quick tier (about 3 minutes)
    slow: one test took 20 s or more in the measured full run
